apiVersion: apps/v1
kind: Deployment
metadata:
  name: banaras-blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: banaras-blog
  template:
    metadata:
      labels:
        app: banaras-blog
    spec:
      containers:
      - name: banaras-blog
        image: banaras-blog:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 10000
---
apiVersion: v1
kind: Service
metadata:
  name: banaras-blog-service
spec:
  selector:
    app: banaras-blog
  type: NodePort
  ports:
    - port: 10000
      targetPort: 10000
      nodePort: 30001
